<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SATs Practice Arena — Full Dashboard</title>
<style>
:root{--card:#ffffff;--ink:#1b1f3b;--muted:#6b7194;--line:#e6e8f5}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",Nunito,system-ui,-apple-system,sans-serif;background:
  radial-gradient(1100px 600px at 12% -8%,#2c2f79 0%,transparent 60%),
  radial-gradient(900px 500px at 100% 0%,#7c2d8f 0%,transparent 55%),
  #0f1230;color:var(--ink);min-height:100vh}
.wrap{max-width:1080px;margin:0 auto;padding:14px 16px 60px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0 16px}
.logo{font-size:1.5rem;font-weight:900;color:#fff;letter-spacing:-.5px}
.logo span{background:linear-gradient(90deg,#ffd166,#ff8fab);-webkit-background-clip:text;background-clip:text;color:transparent}
.spacer{flex:1}
.navbtn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.22);
  padding:9px 16px;border-radius:999px;font-weight:700;cursor:pointer;font-size:.92rem;text-decoration:none;display:inline-block}
.navbtn:hover{background:rgba(255,255,255,.26)}
.navbtn.on{background:#fff;color:#231f5c;border-color:#fff}
.who{display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:.95rem}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:1.1rem;
  background:linear-gradient(135deg,#ffd166,#ff8fab)}
.card{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 18px 44px rgba(6,8,40,.34)}
h1{margin:0 0 6px;font-size:1.7rem}
h3{margin:22px 0 8px;font-size:1.02rem;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
p.sub{margin:0 0 18px;color:var(--muted)}
.btn{border:0;border-radius:14px;padding:13px 22px;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;
  background:#6366f1;color:#fff;box-shadow:0 6px 0 #4338ca;text-decoration:none;display:inline-block}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #4338ca}
.btn.grey{background:#e8eaf6;color:#3b3f6b;box-shadow:0 6px 0 #c9cde8}
.grid{display:grid;gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:800;font-family:inherit;font-size:.95rem;color:#3b3f6b}
.chip:hover{border-color:#6366f1}
.chip.on{background:#6366f1;border-color:#6366f1;color:#fff}
.bar{height:12px;background:#eef0fa;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#22d3ee);border-radius:99px}
.stat{background:#f7f8ff;border-radius:16px;padding:16px;text-align:center}
.stat b{display:block;font-size:2rem;line-height:1.1;color:#312e81}
.stat small{color:var(--muted);font-size:.82rem}
table{width:100%;border-collapse:collapse;font-size:.94rem}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;background:#fff}
tbody tr:hover{background:#f8f9ff}
.tbox{max-height:460px;overflow:auto;border:2px solid var(--line);border-radius:16px}
.tp{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.tp .nm{width:250px;font-weight:700;font-size:.92rem;flex-shrink:0}
.tp .bar{flex:1}
.tp .pc{width:100px;text-align:right;font-weight:800;font-size:.88rem;flex-shrink:0}
.tp .bar>i.g{background:linear-gradient(90deg,#16a34a,#4ade80)}
.tp .bar>i.a{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.tp .bar>i.r{background:linear-gradient(90deg,#e11d48,#fb7185)}
.note{background:#eef6ff;border:2px solid #bcdcff;border-radius:14px;padding:14px;font-size:.93rem;line-height:1.5}
.tabbtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.msg{margin-bottom:14px;border-radius:12px;padding:12px 14px;font-size:.94rem;line-height:1.45}
.msg.info{background:#eef6ff;border:2px solid #bcdcff;color:#12447d}
.msg.err{background:#fff0f3;border:2px solid #ffc0cd;color:#a1103a}
@media(max-width:640px){.tp .nm{width:130px;font-size:.82rem}.wrap{padding:10px}}
</style>

<body>
<div class="wrap">
<header class="top">
  <div class="logo">SATs <span>Practice Arena</span></div>
  <div class="spacer"></div>
  <div id="navbar" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <div class="who"><span class="av" id="avEmoji">🙂</span><span id="whoName"></span></div>
    <a class="navbtn" href="SATs-Practice-Arena.html">🎮 Play</a>
    <a class="navbtn" href="SATs-Practice-Arena.html">📊 My Dashboard</a>

    <button class="navbtn" onclick="logout()">Log out</button>
  </div>
</header>

<section class="card">
  <h1 id="dashTitle">📈 Full Dashboard</h1>

<script>
const SUBJECTS = {
  arithmetic:{name:"Arithmetic",icon:"➕"},
  reasoning :{name:"Reasoning", icon:"🧠"},
  gps       :{name:"Grammar & Punctuation",icon:"✏️"},
  reading   :{name:"Reading",   icon:"📖"}
};
const GAME="SATs-Practice-Arena.html";
/* ==================== SHARED CLOUD BACKEND ====================
   Same Supabase project as the arcade, but its own tables:
   sats_players (accounts)  +  sats_sessions (every completed test).
   Run SUPABASE-SETUP.sql once before using.                        */
const SB_URL='https://wpohvsjkrskhlrayaubp.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indwb2h2c2prcnNraGxyYXlhdWJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzMDEzOTcsImV4cCI6MjA5Njg3NzM5N30.Xi07ayGB5CykR-_7QX-b8UsUmMmTbGIlYpctXYgW9JI';
function sbH(extra){
  const h={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'};
  return Object.assign(h,extra||{});
}
async function sbGet(path){
  const r=await fetch(SB_URL+'/rest/v1/'+path,{headers:sbH()});
  if(!r.ok) throw new Error('read failed ('+r.status+')');
  return r.json();
}
async function sbPost(table,body,extra){
  const r=await fetch(SB_URL+'/rest/v1/'+table,{method:'POST',headers:sbH(extra),body:JSON.stringify(body)});
  if(!r.ok) throw new Error('save failed ('+r.status+') '+(await r.text()).slice(0,120));
  return r;
}
function online(){ return typeof navigator==='undefined' || navigator.onLine!==false }

/* ---- SHA-256: WebCrypto when available, tiny pure-JS fallback otherwise ---- */
const SHA_K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
function utf8Bytes(str){
  const out=[];
  for(let i=0;i<str.length;i++){
    let c=str.codePointAt(i);
    if(c>0xffff) i++;
    if(c<0x80) out.push(c);
    else if(c<0x800) out.push(0xc0|(c>>6),0x80|(c&63));
    else if(c<0x10000) out.push(0xe0|(c>>12),0x80|((c>>6)&63),0x80|(c&63));
    else out.push(0xf0|(c>>18),0x80|((c>>12)&63),0x80|((c>>6)&63),0x80|(c&63));
  }
  return out;
}
function sha256js(str){
  const rr=(v,a)=>((v>>>a)|(v<<(32-a)))>>>0;
  const h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const bytes=utf8Bytes(str), bitLen=bytes.length*8;
  bytes.push(0x80); while(bytes.length%64!==56) bytes.push(0);
  const hi=Math.floor(bitLen/4294967296), lo=bitLen>>>0;
  bytes.push((hi>>>24)&255,(hi>>>16)&255,(hi>>>8)&255,hi&255,(lo>>>24)&255,(lo>>>16)&255,(lo>>>8)&255,lo&255);
  const w=new Array(64);
  for(let b=0;b<bytes.length;b+=64){
    for(let i=0;i<16;i++) w[i]=((bytes[b+i*4]<<24)|(bytes[b+i*4+1]<<16)|(bytes[b+i*4+2]<<8)|bytes[b+i*4+3])>>>0;
    for(let i=16;i<64;i++){
      const s0=(rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3))>>>0;
      const s1=(rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10))>>>0;
      w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0;
    }
    let a=h[0],b2=h[1],c=h[2],d=h[3],e=h[4],f=h[5],g=h[6],hh=h[7];
    for(let i=0;i<64;i++){
      const S1=(rr(e,6)^rr(e,11)^rr(e,25))>>>0, ch=((e&f)^((~e)&g))>>>0;
      const t1=(hh+S1+ch+SHA_K[i]+w[i])>>>0;
      const S0=(rr(a,2)^rr(a,13)^rr(a,22))>>>0, mj=((a&b2)^(a&c)^(b2&c))>>>0;
      const t2=(S0+mj)>>>0;
      hh=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b2;b2=a;a=(t1+t2)>>>0;
    }
    h[0]=(h[0]+a)>>>0;h[1]=(h[1]+b2)>>>0;h[2]=(h[2]+c)>>>0;h[3]=(h[3]+d)>>>0;
    h[4]=(h[4]+e)>>>0;h[5]=(h[5]+f)>>>0;h[6]=(h[6]+g)>>>0;h[7]=(h[7]+hh)>>>0;
  }
  return h.map(x=>x.toString(16).padStart(8,'0')).join('');
}
async function sha256(txt){
  try{
    if(typeof crypto!=='undefined'&&crypto.subtle&&crypto.subtle.digest){
      const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));
      return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  return sha256js(txt);
}
const nameKey=n=>String(n||'').trim().toLowerCase();
const passHash=(n,p)=>sha256(nameKey(n)+':'+String(p));

/* ---- local store: signed-in child, offline queue, cached results ---- */
const LKEY='sats_cloud_v1';
function L(){ try{return JSON.parse(localStorage.getItem(LKEY))||{}}catch(e){return {}} }
function Lsave(o){ localStorage.setItem(LKEY,JSON.stringify(o)) }
function authed(){ const l=L(); return l.auth&&l.auth.name?l.auth:null }
function setAuth(a){ const l=L(); l.auth=a; Lsave(l) }
function clearAuth(){ const l=L(); delete l.auth; Lsave(l) }

/* ---- accounts ---- */
async function findPlayer(name){
  const rows=await sbGet('sats_players?select=*&name_key=eq.'+encodeURIComponent(nameKey(name)));
  return rows[0]||null;
}
async function signUp(name,pass,avatar){
  name=String(name).trim();
  if(name.length<2) throw new Error('Please use at least 2 letters for your name.');
  if(String(pass).length<4) throw new Error('Your password needs at least 4 characters.');
  if(await findPlayer(name)) throw new Error('That name is already taken — try logging in instead.');
  const hash=await passHash(name,pass);
  await sbPost('sats_players',{name:name,name_key:nameKey(name),avatar:avatar||'🦊',pass_hash:hash},{Prefer:'return=minimal'});
  const a={name:name,key:nameKey(name),avatar:avatar||'🦊',hash:hash};
  setAuth(a); return a;
}
async function logIn(name,pass){
  const hash=await passHash(name,pass);
  let row=null,netErr=null;
  try{ row=await findPlayer(name); }catch(e){ netErr=e }
  if(row){
    if(row.pass_hash!==hash) throw new Error('That password does not match. Try again.');
    const a={name:row.name,key:row.name_key,avatar:row.avatar||'🦊',hash:hash};
    setAuth(a); return a;
  }
  if(netErr){ // offline: allow back in if this device has seen them before
    const l=L(), cached=(l.known||{})[nameKey(name)];
    if(cached&&cached.hash===hash){ setAuth(cached); return cached }
    throw new Error("Can't reach the internet, and this computer doesn't know that login yet.");
  }
  throw new Error('No account with that name yet — tap “New account”.');
}
function rememberDevice(a){ const l=L(); l.known=l.known||{}; l.known[a.key]=a; Lsave(l) }

/* ---- results: save with offline queue ---- */
function uuid(){ return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,10) }
async function saveSession(rec){
  const l=L(); l.queue=l.queue||[]; l.cache=l.cache||[];
  l.cache.push(rec); if(l.cache.length>400) l.cache=l.cache.slice(-400);
  l.queue.push(rec); Lsave(l);
  return flushQueue();
}
async function flushQueue(){
  const l=L(); const q=(l.queue||[]).slice();
  if(!q.length) return {sent:0,left:0};
  if(!online()) return {sent:0,left:q.length};
  let sent=0;
  for(const rec of q){
    try{
      await sbPost('sats_sessions',{
        player_key:rec.player_key, player:rec.player, subject:rec.subj, mode:rec.mode,
        year:rec.year||null, paper:rec.paper||null, topic_filter:rec.topicFilter||null,
        passage_title:rec.passageTitle||null, questions:rec.n, got:rec.got, max:rec.max,
        secs:rec.secs, topics:rec.topics, client_id:rec.client_id,
        played_at:new Date(rec.date).toISOString()
      },{Prefer:'return=minimal,resolution=ignore-duplicates'});
      sent++;
    }catch(e){ break }
  }
  const l2=L(); l2.queue=(l2.queue||[]).slice(sent); Lsave(l2);
  return {sent:sent,left:(l2.queue||[]).length};
}
/* rows from the cloud, newest last; falls back to this device's cache when offline */
async function loadSessions(key){
  try{
    const rows=await sbGet('sats_sessions?select=*&player_key=eq.'+encodeURIComponent(key)+'&order=played_at.asc&limit=1000');
    const mapped=rows.map(r=>({
      client_id:r.client_id, date:new Date(r.played_at).getTime(), player:r.player, player_key:r.player_key,
      subj:r.subject, mode:r.mode, year:r.year, paper:r.paper, topicFilter:r.topic_filter,
      passageTitle:r.passage_title, n:r.questions, got:r.got, max:r.max, secs:r.secs,
      topics:(typeof r.topics==='string'?JSON.parse(r.topics):r.topics)||{}
    }));
    const l=L(); const pending=(l.queue||[]).filter(x=>x.player_key===key&&!mapped.some(m=>m.client_id===x.client_id));
    const all=mapped.concat(pending).sort((a,b)=>a.date-b.date);
    l.cache=all.slice(-400); Lsave(l);
    return {rows:all,offline:false};
  }catch(e){
    const l=L();
    const all=(l.cache||[]).filter(x=>x.player_key===key).sort((a,b)=>a.date-b.date);
    return {rows:all,offline:true};
  }
}

/* ==================== FULL DASHBOARD ==================== */
let user=null, dashFilter="all", ALL=[], OFFLINE=false;

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])) }
function fmtT(s){ return s>=60?Math.floor(s/60)+"m "+(s%60)+"s":s+"s" }
function streak(ss){
  if(!ss.length) return 0;
  const days=[...new Set(ss.map(s=>new Date(s.date).toDateString()))].map(d=>new Date(d).getTime()).sort((a,b)=>b-a);
  let n=0,cur=new Date(); cur.setHours(0,0,0,0);
  if(days[0]<cur.getTime()-864e5) return 0;
  for(const d of days){ if(Math.abs(d-cur.getTime())<=864e5){n++; cur=new Date(d-864e5)} else break }
  return n;
}
function topicRow(t,v){
  const p=v.max?Math.round(100*v.got/v.max):0, c=p>=80?"g":p>=60?"a":"r";
  return `<div class="tp"><div class="nm">${esc(t)}</div><div class="bar"><i class="${c}" style="width:${p}%"></i></div>
    <div class="pc">${v.got}/${v.max} · ${p}%</div></div>`;
}
function chart(ss){
  if(ss.length<2) return '<p class="sub">Take at least two tests to see your progress line.</p>';
  const pts=ss.map(s=>s.max?100*s.got/s.max:0);
  const W=Math.max(340,Math.min(900,pts.length*60)), H=180, P=30;
  const x=i=>P+i*(W-2*P)/Math.max(1,pts.length-1), y=v=>H-P-(v/100)*(H-2*P);
  const line=pts.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1)).join(" ");
  const area=line+` L${x(pts.length-1).toFixed(1)},${H-P} L${x(0).toFixed(1)},${H-P} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="200" style="background:#f7f8ff;border-radius:16px">
    ${[0,50,100].map(g=>`<line x1="${P}" y1="${y(g)}" x2="${W-P}" y2="${y(g)}" stroke="#dfe2f2"/>
      <text x="4" y="${y(g)+4}" font-size="10" fill="#8b90b5">${g}%</text>`).join("")}
    <path d="${area}" fill="rgba(99,102,241,.16)"/>
    <path d="${line}" fill="none" stroke="#6366f1" stroke-width="3" stroke-linejoin="round"/>
    ${pts.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="5" fill="${v>=70?"#16a34a":v>=50?"#f59e0b":"#e11d48"}" stroke="#fff" stroke-width="2"><title>${Math.round(v)}% — ${(SUBJECTS[ss[i].subj]||{}).name||""}</title></circle>`).join("")}
  </svg>`;
}
/* ---- SATs Record cells: date · clock time · topic ---- */
function dateCell(t){ return new Date(t).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:"numeric"}) }
function timeCell(t){ return new Date(t).toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}) }
function topicCell(s){
  const icon=(SUBJECTS[s.subj]||{}).icon||"";
  let label;
  if(s.topicFilter) label=s.topicFilter;
  else if(s.passageTitle) label=s.passageTitle;
  else{
    const ts=Object.entries(s.topics||{}).sort((a,b)=>b[1].max-a[1].max);
    if(!ts.length) label=(SUBJECTS[s.subj]||{}).name||s.subj;
    else if(ts.length===1) label=ts[0][0];
    else label=ts.slice(0,2).map(x=>x[0]).join(", ")+(ts.length>2?" +"+(ts.length-2)+" more":"");
  }
  return `${icon} ${esc(label)}`;
}
function when(t){
  const dd=Math.floor((new Date().setHours(0,0,0,0)-new Date(t).setHours(0,0,0,0))/864e5);
  return (dd===0?"today":dd===1?"yesterday":dateCell(t))+" at "+timeCell(t);
}
function setFilter(f){ dashFilter=f; render() }

async function load(){
  const a=authed();
  const body=document.getElementById("dashBody");
  if(!a){
    document.getElementById("dashTitle").textContent="📈 Full Dashboard";
    document.getElementById("dashSub").textContent="";
    body.innerHTML=`<div class="msg info">Nobody is logged in on this computer yet.</div>
      <p class="sub">Open the game, log in with your name and password, and your results will appear here — from any computer.</p>
      <a class="btn" href="${GAME}">🎮 Open the game</a>`;
    return;
  }
  user=a;
  document.getElementById("whoName").textContent=a.name;
  document.getElementById("avEmoji").textContent=a.avatar||"🙂";
  document.getElementById("dashTitle").textContent=`📈 ${a.name}'s Full Dashboard`;
  body.innerHTML='<p class="sub">Loading your results…</p>';
  await flushQueue();
  const res=await loadSessions(a.key);
  ALL=res.rows; OFFLINE=res.offline;
  render();
}

function render(){
  const all=ALL, body=document.getElementById("dashBody");
  document.getElementById("dashSub").textContent=all.length?
    `${all.length} test${all.length>1?"s":""} completed · last one ${when(all[all.length-1].date)}`:
    "No tests yet — play a quiz and your progress will appear here.";
  if(!all.length){
    body.innerHTML=`<div class="note">Play your first quiz and this page will fill up with your scores, your strongest topics and the ones to work on.</div>
      <div style="margin-top:16px"><a class="btn" href="${GAME}">Pick a subject ▶</a></div>`;
    return;
  }
  const ss=dashFilter==="all"?all:all.filter(s=>s.subj===dashFilter);
  const got=ss.reduce((a,b)=>a+b.got,0), max=ss.reduce((a,b)=>a+b.max,0);
  const avg=max?Math.round(100*got/max):0;
  const best=ss.reduce((a,b)=>Math.max(a,b.max?Math.round(100*b.got/b.max):0),0);
  const mins=Math.round(ss.reduce((a,b)=>a+b.secs,0)/60);

  const T={};
  ss.forEach(s=>Object.entries(s.topics||{}).forEach(([t,v])=>{
    const key=s.subj+"|"+t; T[key]=T[key]||{got:0,max:0,subj:s.subj,topic:t};
    T[key].got+=v.got; T[key].max+=v.max; }));
  const list=Object.values(T).filter(x=>x.max>=3).map(x=>({...x,pc:Math.round(100*x.got/x.max)}));
  const strong=list.filter(x=>x.pc>=80).sort((a,b)=>b.pc-a.pc);
  const okish =list.filter(x=>x.pc>=60&&x.pc<80).sort((a,b)=>b.pc-a.pc);
  const weak  =list.filter(x=>x.pc<60).sort((a,b)=>a.pc-b.pc);

  body.innerHTML=`
  ${OFFLINE?'<div class="msg info">📴 Offline — showing what is stored on this computer. It will refresh when you are back online.</div>':''}
  <div class="tabbtns">
    <button class="chip${dashFilter==="all"?" on":""}" onclick="setFilter('all')">All subjects</button>
    ${Object.entries(SUBJECTS).map(([k,s])=>`<button class="chip${dashFilter===k?" on":""}" onclick="setFilter('${k}')">${s.icon} ${s.name}</button>`).join("")}
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">
    <div class="stat"><b>${ss.length}</b><small>tests</small></div>
    <div class="stat"><b>${avg}%</b><small>average</small></div>
    <div class="stat"><b>${best}%</b><small>best score</small></div>
    <div class="stat"><b>${ss.reduce((a,b)=>a+b.n,0)}</b><small>questions</small></div>
    <div class="stat"><b>${mins}m</b><small>time practising</small></div>
    <div class="stat"><b>${streak(all)}🔥</b><small>day streak</small></div>
  </div>

  <h3>Progress over time</h3>
  ${chart(ss)}

  <h3>Score by subject</h3>
  ${Object.keys(SUBJECTS).map(k=>{
      const sub=all.filter(s=>s.subj===k); if(!sub.length) return "";
      const g=sub.reduce((a,b)=>a+b.got,0), m=sub.reduce((a,b)=>a+b.max,0);
      return topicRow(SUBJECTS[k].icon+" "+SUBJECTS[k].name,{got:g,max:m});
    }).join("")||'<p class="sub">No data yet.</p>'}

  <h3>💪 Strengths — keep it up</h3>
  ${strong.length?strong.slice(0,10).map(x=>topicRow(SUBJECTS[x.subj].icon+" "+x.topic,x)).join("")
    :'<p class="sub">Answer a few more questions and your strongest topics will show here (a topic needs at least 3 marks attempted).</p>'}

  <h3>🎯 Needs improvement — practise these next</h3>
  ${weak.length?weak.slice(0,10).map(x=>topicRow(SUBJECTS[x.subj].icon+" "+x.topic,x)).join("")+
      `<div class="note" style="margin-top:12px">👉 Open the game, choose <b>${SUBJECTS[weak[0].subj].name} → Practice</b> and pick the topic
        <b>${esc(weak[0].topic)}</b>. Ten questions a day makes a big difference.</div>`
    :'<p class="sub">Nothing below 60% — great going! 🎉</p>'}

  ${okish.length?`<h3>🙂 Getting there</h3>${okish.slice(0,10).map(x=>topicRow(SUBJECTS[x.subj].icon+" "+x.topic,x)).join("")}`:""}

  <h3>📋 SATs Record</h3>
  <div class="tbox"><table>
    <thead><tr><th>Name</th><th>Date</th><th>Time</th><th>Topic</th><th>Score</th></tr></thead>
    <tbody>${ss.slice().reverse().map(s=>{
      const p=s.max?Math.round(100*s.got/s.max):0;
      return `<tr>
        <td><b>${esc(user.name)}</b></td>
        <td>${dateCell(s.date)}</td>
        <td>${timeCell(s.date)}</td>
        <td>${topicCell(s)}</td>
        <td><b style="color:${p>=70?"#16a34a":p>=50?"#b45309":"#e11d48"}">${s.got}/${s.max} · ${p}%</b></td>
      </tr>`;
    }).join("")}</tbody></table></div>

  <div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap">
    <a class="btn" href="${GAME}">🎮 Practise now</a>
    <button class="btn grey" onclick="exportCsv()">⬇️ Export record (CSV)</button>
    <button class="btn grey" onclick="load()">🔄 Refresh</button>
  </div>`;
}
function exportCsv(){
  const rows=[["Name","Date","Time","Topic","Score","Out of","Percent"]];
  ALL.forEach(s=>rows.push([user.name,dateCell(s.date),timeCell(s.date),
    topicCell(s).replace(/^\S+\s/,""),s.got,s.max,s.max?Math.round(100*s.got/s.max):0]));
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"}));
  a.download=`SATs_record_${user.name}.csv`; a.click();
}
function logout(){ clearAuth(); location.href=GAME }
load();
</script>
</body>
</html>
