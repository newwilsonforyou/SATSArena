<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SATs Practice Arena</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;
  font-family:"Segoe UI",Nunito,system-ui,-apple-system,sans-serif;color:#fff;background:
  radial-gradient(1100px 600px at 12% -8%,#2c2f79 0%,transparent 60%),
  radial-gradient(900px 500px at 100% 0%,#7c2d8f 0%,transparent 55%),#0f1230}
.box{padding:24px;max-width:560px}
h1{font-size:2.2rem;margin:0 0 8px;font-weight:900}
h1 span{background:linear-gradient(90deg,#ffd166,#ff8fab);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:#c8cdf0;margin:0 0 28px}
a{display:inline-block;margin:6px;padding:15px 28px;border-radius:16px;text-decoration:none;
  font-weight:800;font-size:1.05rem;background:#6366f1;color:#fff;box-shadow:0 6px 0 #4338ca}
a.alt{background:rgba(255,255,255,.14);box-shadow:0 6px 0 rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22)}
a.off{opacity:.4;pointer-events:none}
small{display:block;margin-top:26px;color:#8f95c4;font-size:.82rem}
#warn{display:none;margin-top:22px;background:rgba(255,209,102,.12);border:1px solid rgba(255,209,102,.4);
  border-radius:14px;padding:14px;color:#ffd9a0;font-size:.9rem;line-height:1.5}
</style>
</head>
<body>
<div class="box">
  <h1>SATs <span>Practice Arena</span></h1>
  <p>Year 6 · Arithmetic · Reasoning · Grammar &amp; Punctuation · Reading</p>
  <a id="play" class="off" href="#">🎮 Start practising</a>
  <a id="dash" class="alt off" href="#">📈 Full dashboard</a>
  <div id="warn">Couldn't find the game files. They should be either next to this page,
    or inside a folder called <b>Game</b>.</div>
  <small>2,445 real KS2 questions · past papers 2016–2025</small>
</div>
<script>
/* The two HTML files may sit next to this page or inside a Game folder.
   Find whichever exists and point the buttons at it. */
(async function(){
  const roots=["Game/","","SATS/Game/"];
  for(const r of roots){
    try{
      const res=await fetch(r+"SATs-Practice-Arena.html",{method:"HEAD"});
      if(res.ok){
        const p=document.getElementById("play"), d=document.getElementById("dash");
        p.href=r+"SATs-Practice-Arena.html"; p.classList.remove("off");
        d.href=r+"SATs-Dashboard.html";      d.classList.remove("off");
        return;
      }
    }catch(e){}
  }
  document.getElementById("warn").style.display="block";
})();
</script>
</body>
</html>
